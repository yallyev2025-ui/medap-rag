# Локальная разработка и запасной путь развёртывания на облачном сервере.
#
# На Timeweb App Platform используется только Dockerfile, а Postgres берётся
# managed (с включённым расширением vector в панели) — сервис db тогда не нужен.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: medap
      POSTGRES_PASSWORD: medap
      POSTGRES_DB: medap
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medap"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Свой метапоиск: без ключей и оплаты, наружу не открыт (ТЗ 20.11.2026).
  # Жёсткие лимиты: контейнер не должен отнимать память у бота.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    mem_limit: 320m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    env_file: .env
    environment:
      # Перебиваем DATABASE_URL из .env на адрес контейнера с БД.
      DATABASE_URL: postgresql+asyncpg://medap:medap@db:5432/medap
      PORT: "8000"
      # Поиск идёт через свой SearXNG, ключи Yandex не нужны
      SEARXNG_URL: http://searxng:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started

volumes:
  pgdata:
